name: Pages Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://su-long-ai.github.io
  PUBLIC_BASE_PATH: /personal-universe
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main ref is available for manual preview validation
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin main --no-tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Machine Reuse Gate for deployment ref
        run: npm run gate:reuse:ci
        env:
          REUSE_GATE_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && 'origin/main' || github.event.before }}
          REUSE_GATE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && 'HEAD' || github.sha }}

      - name: Build repository-subpath site
        run: npm run build

      - name: Bundle guard
        run: node tests/ci/bundle-guard.mjs

      - name: Preserve deployable Pages build
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify configured Pages base path
        shell: bash
        run: |
          expected="/personal-universe"
          actual="${{ steps.pages.outputs.base_path }}"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Pages base path $expected but configure-pages reported $actual" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live homepage and YEIS catalogue
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}" >/dev/null
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}vendor/yeis/data/stars.bin" >/dev/null
          {
            echo "## Personal Universe is online"
            echo
            echo "- Production URL: ${base}"
            echo "- Live homepage probe: PASS"
            echo "- Live YEIS stars.bin probe: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
