name: Pages Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://su-long-ai.github.io
  PUBLIC_BASE_PATH: /personal-universe
  PLAYWRIGHT_VERSION: 1.65.1
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main ref is available for manual preview validation
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin main --no-tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Machine Reuse Gate for deployment ref
        run: npm run gate:reuse:ci
        env:
          REUSE_GATE_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && 'origin/main' || github.event.before }}
          REUSE_GATE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && 'HEAD' || github.sha }}

      - name: Build repository-subpath site
        run: npm run build

      - name: Bundle guard
        run: node tests/ci/bundle-guard.mjs

      - name: Verify repository-subpath runtime asset URLs
        shell: bash
        run: |
          base="${PUBLIC_BASE_PATH%/}/"
          broken="${PUBLIC_BASE_PATH%/}"
          if grep -R -I -E "${broken}(vendor|textures|audio|nebulae)/" dist; then
            echo "Found runtime asset URL concatenated without the project-site slash" >&2
            exit 1
          fi
          for asset in \
            "vendor/yeis/" \
            "textures/stars_milky_way.jpg" \
            "audio/deep-space.ogg" \
            "nebulae/"; do
            if ! grep -R -I -F -q "${base}${asset}" dist; then
              echo "Expected built runtime asset prefix ${base}${asset} was not found" >&2
              exit 1
            fi
          done

      - name: Preserve deployable Pages build
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify configured Pages base path
        shell: bash
        run: |
          expected="/personal-universe"
          actual="${{ steps.pages.outputs.base_path }}"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Pages base path $expected but configure-pages reported $actual" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify live homepage and YEIS catalogue
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}" >/dev/null
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${base}vendor/yeis/data/stars.bin" >/dev/null
          {
            echo "## Personal Universe is online"
            echo
            echo "- Production URL: ${base}"
            echo "- Live homepage probe: PASS"
            echo "- Live YEIS stars.bin probe: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout deployed ref for browser smoke
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: Setup Node for live browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies for live browser smoke
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium and host dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify cached Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Verify browser tooling did not mutate lockfiles
        run: git diff --exit-code -- package.json package-lock.json

      - name: Verify live YEIS boot, Canvas, assets, and wheel ownership
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const base = `${process.env.PAGE_URL.replace(/\/$/, "")}/`;
          const origin = new URL(base).origin;
          const pageErrors = [];
          const criticalFailures = [];

          const browser = await chromium.launch({
            headless: true,
            args: [
              "--disable-dev-shm-usage",
              "--use-gl=angle",
              "--use-angle=swiftshader",
            ],
          });

          try {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
            });

            page.on("pageerror", (error) => {
              pageErrors.push(error.message);
            });
            page.on("requestfailed", (request) => {
              const url = new URL(request.url());
              if (url.origin !== origin) return;
              const path = url.pathname;
              if (
                path.includes("/_astro/") ||
                path.includes("/vendor/yeis/") ||
                path.includes("/textures/") ||
                path.includes("/audio/") ||
                path.includes("/nebulae/") ||
                path.endsWith("/stars.bin")
              ) {
                criticalFailures.push(
                  `${path}: ${request.failure()?.errorText ?? "failed"}`,
                );
              }
            });

            await page.goto(`${base}?freeze=1`, {
              waitUntil: "domcontentloaded",
              timeout: 60_000,
            });

            await page.waitForFunction(
              () => document.documentElement.dataset.universeEngine === "yeis",
              undefined,
              { timeout: 30_000 },
            );
            await page.locator("canvas").waitFor({
              state: "visible",
              timeout: 30_000,
            });

            const canvasCount = await page.locator("canvas").count();
            if (canvasCount !== 1) {
              throw new Error(
                `Expected one live universe canvas, found ${canvasCount}`,
              );
            }

            const canvas = page.locator("canvas");
            const box = await canvas.boundingBox();
            if (!box) throw new Error("Live universe canvas has no layout box");

            await page.mouse.move(
              box.x + box.width * 0.5,
              box.y + box.height * 0.5,
            );
            await page.mouse.wheel(0, -120);

            await page.waitForFunction(
              () => {
                const data = document.documentElement.dataset;
                const position = Number(data.universeScalePosition);
                return (
                  data.universeNavigationPhase === "galaxy" &&
                  data.universeScaleDirection === "in" &&
                  Number.isFinite(position) &&
                  position > 0 &&
                  position < 1 &&
                  Boolean(data.universeGalaxyScaleTarget)
                );
              },
              undefined,
              { timeout: 10_000 },
            );

            const inwardPosition = await page.evaluate(() =>
              Number(document.documentElement.dataset.universeScalePosition),
            );
            if (!(inwardPosition > 0 && inwardPosition < 1)) {
              throw new Error(
                `Expected one live wheel sample to hold an intermediate Galaxy scale position, got ${inwardPosition}`,
              );
            }

            await page.mouse.wheel(0, 120);
            await page.waitForFunction(
              () => {
                const data = document.documentElement.dataset;
                const position = Number(data.universeScalePosition);
                return (
                  data.universeNavigationPhase === "galaxy" &&
                  data.universeScaleDirection === "out" &&
                  Number.isFinite(position) &&
                  Math.abs(position) < 0.001
                );
              },
              undefined,
              { timeout: 10_000 },
            );

            await page.waitForTimeout(500);

            const finalCanvasCount = await page.locator("canvas").count();
            if (finalCanvasCount !== 1) {
              throw new Error(
                `Expected one canvas after live scale reversal, found ${finalCanvasCount}`,
              );
            }
            await page.screenshot({ path: "pages-live-smoke.png" });

            if (pageErrors.length) {
              throw new Error(
                `Live browser page errors: ${pageErrors.join(" | ")}`,
              );
            }
            if (criticalFailures.length) {
              throw new Error(
                `Live critical request failures: ${criticalFailures.join(" | ")}`,
              );
            }
          } finally {
            await browser.close();
          }
          NODE

          {
            echo "- Live Chromium YEIS boot: PASS"
            echo "- Live single-Canvas probe: PASS"
            echo "- Live direct Galaxy scale midpoint + reversal probe: PASS"
            echo "- Live critical asset/browser error probe: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live Pages browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-live-smoke.png
          if-no-files-found: warn
          retention-days: 14
