name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: personal-universe-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.65.1
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  reuse-gate:
    name: Machine Reuse Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main ref is available for manual branch validation
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin main --no-tags

      - name: Ensure push range base commit is available
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BEFORE_SHA}"
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Verify PR/push diff against machine approvals
        run: npm run gate:reuse:ci
        env:
          REUSE_GATE_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && 'origin/main' || github.event.pull_request.base.sha || github.event.before }}
          REUSE_GATE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && 'HEAD' || github.event.pull_request.head.sha || github.sha }}

  build:
    name: Build + Bundle Guard
    needs: reuse-gate
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/webgl-surface-release-v1' || github.ref == 'refs/heads/agent/release-visual-acceptance-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Bundle and asset regression guard
        run: node tests/ci/bundle-guard.mjs

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-build-metrics-${{ github.run_id }}
          path: ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    needs: build
    # Pin browser jobs to the LTS image Playwright's Linux dependency installer
    # supports reliably; ubuntu-latest may roll forward independently.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: Download validated dist
        uses: actions/download-artifact@v4
        with:
          name: personal-universe-dist-${{ github.run_id }}
          path: dist

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium and host dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify cached Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Verify browser tooling did not mutate lockfiles
        run: git diff --exit-code -- package.json package-lock.json

      - name: Playwright release shard
        run: npx playwright test --project=release --shard=${{ matrix.shard }}/4

      - name: Append runtime metrics
        if: always()
        shell: bash
        run: |
          if [ -f test-results/runtime-metrics.md ]; then
            cat test-results/runtime-metrics.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright shard report, traces, screenshots, and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-e2e-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            blob-report
            playwright-report
            test-results
            ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  webgl-heavy:
    name: WebGL heavy renderer
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: Download validated dist
        uses: actions/download-artifact@v4
        with:
          name: personal-universe-dist-${{ github.run_id }}
          path: dist

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium and host dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify cached Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Verify browser tooling did not mutate lockfiles
        run: git diff --exit-code -- package.json package-lock.json

      - name: Playwright WebGL heavy lane
        run: npx playwright test --project=webgl-heavy

      - name: Upload WebGL heavy report, traces, screenshots, and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-e2e-${{ github.run_id }}-webgl-heavy
          path: |
            blob-report
            playwright-report
            test-results
            ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  e2e-report:
    name: Combined Playwright Report
    needs: [e2e, webgl-heavy]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' && needs.webgl-heavy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: Install pinned Playwright report tooling
        run: npm install --no-save --package-lock=false @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: personal-universe-e2e-${{ github.run_id }}-*
          path: merged-e2e-artifacts
          merge-multiple: true

      - name: Merge Playwright blob reports
        shell: bash
        run: |
          shopt -s nullglob
          reports=(merged-e2e-artifacts/blob-report/*.zip)
          if (( ${#reports[@]} == 0 )); then
            echo "No Playwright blob reports were produced by the shards." >&2
            exit 1
          fi
          npx playwright merge-reports --reporter=html merged-e2e-artifacts/blob-report

      - name: Upload combined Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize browser validation
        if: always()
        shell: bash
        run: |
          {
            echo "## Playwright browser validation"
            echo
            echo "- Sharded release result: **${{ needs.e2e.result }}**"
            echo "- WebGL heavy result: **${{ needs.webgl-heavy.result }}**"
            echo '- Combined report artifact: `personal-universe-playwright-report-${{ github.run_id }}`'
            echo "- Release-shard and WebGL-heavy artifacts retain screenshots, traces, raw reports, and runtime metrics."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Propagate browser validation failures
        if: always()
        shell: bash
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ] || [ "${{ needs.webgl-heavy.result }}" != "success" ]; then
            echo "Browser validation did not fully succeed; merged diagnostics were preserved above." >&2
            exit 1
          fi
