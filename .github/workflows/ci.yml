name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.65.1
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  validate:
    name: Build + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic install
        run: npm ci

      - name: Reuse Gate
        run: npm run gate:reuse

      - name: Production build
        run: npm run build

      - name: Bundle and asset regression guard
        run: node tests/ci/bundle-guard.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@${PLAYWRIGHT_VERSION}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify install did not mutate lockfiles
        run: git diff --exit-code -- package.json package-lock.json

      - name: Playwright E2E + visual artifacts
        run: npx playwright test

      - name: Append runtime metrics
        if: always()
        shell: bash
        run: |
          if [ -f test-results/runtime-metrics.md ]; then
            cat test-results/runtime-metrics.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report, traces, screenshots, and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-universe-e2e-${{ github.sha }}
          path: |
            playwright-report
            test-results
            ci-artifacts
          if-no-files-found: warn
          retention-days: 14
