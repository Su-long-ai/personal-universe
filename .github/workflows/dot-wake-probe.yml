name: Dot Wake Comment Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  comment-probe:
    if: ${{ github.head_ref == 'relay/dot-wake-pr-comment-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit bot-authored wake probe comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="<!-- dot-wake:probe:${RUN_ID}:${RUN_ATTEMPT} -->
          DOT_WAKE_PROBE run_id=${RUN_ID} attempt=${RUN_ATTEMPT} head_sha=${HEAD_SHA}"
          gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
